name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The project has no runtime dependencies, so only the dev tools install.
      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      # Runs fully offline. No API key is configured for CI on purpose.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: ruff check src/ tests/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a TypeSafe key was ever committed
        run: |
          if grep -rInE 'apikey_[A-Za-z0-9]{20,}' . --exclude-dir=.git; then
            echo "A TypeSafe API key is present in the repo."
            exit 1
          fi
          echo "No API keys found."
