[project]
name = "jev-arcade"
version = "0.1.0"
description = "Can a System One model play arcade games? TypeSafe's Jev plays Tetris, Snake and 2048."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cankat Sarac" }]
keywords = ["typesafe", "jev", "system-one", "games", "benchmark", "tetris"]

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "tetris-gymnasium>=0.2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/CankatSarac/jev-arcade"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_arcade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
