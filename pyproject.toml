[project]
name = "jev-arcade"
version = "0.1.0"
description = "Can a System One model play arcade games? TypeSafe's Jev plays Tetris, Snake and 2048."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cankat Sarac" }]
keywords = ["typesafe", "jev", "system-one", "games", "benchmark", "tetris", "gymnasium"]

# No runtime dependencies. The three hand written games and the TypeSafe
# client all use the standard library, so a clone runs with nothing installed.
dependencies = []

[project.optional-dependencies]
# Adds FrozenLake, CliffWalking, Taxi and Blackjack through one adapter.
gym = ["gymnasium>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/CankatSarac/jev-arcade"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_arcade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
